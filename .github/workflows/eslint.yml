name: ESLint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eslint:
    name: Run eslint scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        path: main

    - name: Checkout ESLint config repository
      uses: actions/checkout@v7
      with:
        path: lint
        repository: WazeDev/Eslint-Config

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: Restore Cached NPM
      uses: actions/cache/restore@v6
      id: npm-cache
      with:
        path: lint/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}-${{ hashFiles('**/eslint.config.mjs') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install ESLint config dependencies
      if: steps.npm-cache.outputs.cache-hit != 'true'
      run: |
        cd lint
        npm install

    - name: Cache NPM Packages
      if: steps.npm-cache.outputs.cache-hit != 'true'
      id: npm-cache-save
      uses: actions/cache/save@v6
      with:
        path: lint/node_modules
        key: ${{ steps.npm-cache.outputs.cache-primary-key }}
    
    - name: Copy JS files to lint folder
      run: |
        cp main/*.js lint/
        ls lint

    - name: Run ESLint
      uses: reviewdog/action-eslint@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        # PR: review comments on changed lines; push: check run over the whole file
        reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
        filter_mode: ${{ github.event_name == 'pull_request' && 'added' || 'nofilter' }}
        fail_level: warning
        workdir: lint
        eslint_flags: "**/*.js --config eslint.config.mjs"

    
